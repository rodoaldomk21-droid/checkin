<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guanabara Check-in PRO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root { --primary: #002d5e; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --bg: #f3f4f6; --card: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        header { background: var(--primary); color: white; padding: 18px; text-align: center; font-weight: 700; }
        .container { max-width: 480px; margin: auto; padding: 16px; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 15px; margin-bottom: 12px; border: 2px solid #e5e7eb; border-radius: 14px; font-size: 16px; box-sizing: border-box; text-align: center; }
        .btn { border: none; padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; font-size: 13px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-outline { background: #f8fafc; border: 2px solid var(--primary); color: var(--primary); }
        .btn-bag { background: var(--warning); color: white; width: 45px; height: 45px; border-radius: 10px; padding: 0; }
        .p-row { display: flex; align-items: center; padding: 15px; background: white; border-radius: 16px; margin-bottom: 10px; border: 1px solid #edf2f7; cursor: pointer; }
        .p-row.ok { border-left: 6px solid var(--success); background: #f0fdf4; }
        .polt-badge { background: #f1f5f9; color: var(--primary); width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 700; margin-right: 12px; }
        .log-info { font-size: 10px; color: var(--success); font-weight: 600; }
        #modal-excesso { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="view-login" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--primary);">
    <h2 style="color: white;">GUANABARA RECIFE</h2>
    <div class="container" style="width: 100%;">
        <input type="text" id="login-matricula" placeholder="Matrícula">
        <input type="password" id="login-senha" placeholder="Senha">
        <button class="btn" style="background:white; color:var(--primary)" onclick="autenticar()">ENTRAR</button>
    </div>
</div>

<div id="app-content" style="display: none;">
    <header>GUANABARA RECIFE <br> <small id="display-user" style="font-size:10px; opacity:0.8;"></small></header>

    <div id="view-menu" class="container">
        <div id="area-master" class="card" style="display: none; border-top: 5px solid var(--warning);">
            <h3 style="text-align:center; margin:0 0 15px 0;">PAINEL MASTER</h3>
            <input type="time" id="input-hora">
            <input type="text" id="input-destino" placeholder="Destino (ex: Fortaleza)">
            <button class="btn btn-blue" onclick="adicionarViagem()">➕ CRIAR LISTA</button>
            <button class="btn btn-outline" style="margin-top:10px;" onclick="toggleGestao()">👥 GERENCIAR USUÁRIOS</button>
        </div>

        <div id="gestao-usuarios" class="card" style="display:none; background: #f8fafc;">
            <input type="text" id="novo-user-nome" placeholder="Nome do Operador">
            <input type="text" id="novo-user-mat" placeholder="Matrícula">
            <input type="password" id="novo-user-senha" placeholder="Senha">
            <button class="btn btn-blue" onclick="cadastrarUsuario()">SALVAR ACESSO</button>
        </div>

        <div id="lista-viagens-container"></div>
    </div>

    <div id="view-lista" class="container" style="display:none">
        <button onclick="irParaMenu()" style="background:none; border:none; font-weight:700; color:var(--primary); margin-bottom:15px;">◀ VOLTAR</button>
        <div class="card" style="text-align:center;">
            <h3 id="titulo-viagem" style="margin-bottom:15px;"></h3>
            <button class="btn btn-blue" onclick="document.getElementById('file-input').click()">📥 IMPORTAR MAPA (PDF)</button>
            <input type="file" id="file-input" accept="application/pdf" style="display:none">
            <div id="loader" style="display:none; margin-top:10px; font-weight:700; color:var(--primary);">PROCESSANDO PDF...</div>
        </div>
        <div id="passageiros-lista"></div>
    </div>
</div>

<div id="modal-excesso">
    <div class="card" style="width: 90%; max-width: 400px;">
        <h3>📦 EXCESSO DE BAGAGEM</h3>
        <p id="pax-excesso-info" style="font-weight:700; font-size:14px;"></p>
        <input type="number" id="bag-qtd" placeholder="Qtd Volumes">
        <input type="number" id="bag-valor" placeholder="Valor R$">
        <select id="bag-beneficiario"></select>
        <button class="btn btn-blue" style="background:#25d366" onclick="salvarENotificar()">SALVAR E ENVIAR ZAP</button>
        <button class="btn" style="background:none; color:var(--danger)" onclick="document.getElementById('modal-excesso').style.display='none'">CANCELAR</button>
    </div>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyAnjkMAQbs9h2cZNfl0SVhgcdix1A0laL0",
        authDomain: "guanabara-checkin.firebaseapp.com",
        databaseURL: "https://guanabara-checkin-default-rtdb.firebaseio.com",
        projectId: "guanabara-checkin",
        storageBucket: "guanabara-checkin.firebasestorage.app",
        messagingSenderId: "265228574249",
        appId: "1:265228574249:web:abd33b5a15756ebde18638"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = null;
    let atualViagemKey = null;
    let paxSelecionadoObj = null;

    // LOGIN
    function autenticar() {
        const mat = document.getElementById('login-matricula').value.trim();
        const pass = document.getElementById('login-senha').value.trim();
        if(mat === "c07011946" && pass === "guana123") {
            entrarApp({ nome: "Master", matricula: "c07011946", role: "master" });
        } else {
            db.ref('usuarios/' + mat).once('value', snap => {
                const u = snap.val();
                if(u && u.senha === pass) entrarApp(u); else alert("Matrícula ou senha inválida!");
            });
        }
    }

    function entrarApp(user) {
        currentUser = user;
        document.getElementById('view-login').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('display-user').innerText = `Operador: ${user.nome}`;
        if(user.role === 'master') document.getElementById('area-master').style.display = 'block';
        carregarBeneficiarios();
    }

    // GESTÃO DE USUÁRIOS
    function toggleGestao() { const d = document.getElementById('gestao-usuarios'); d.style.display = d.style.display==='none'?'block':'none'; }
    function cadastrarUsuario() {
        const n = document.getElementById('novo-user-nome').value;
        const m = document.getElementById('novo-user-mat').value;
        const s = document.getElementById('novo-user-senha').value;
        if(!n || !m || !s) return alert("Preencha tudo!");
        db.ref('usuarios/' + m).set({ nome: n, matricula: m, senha: s, role: "operador" }).then(() => { alert("Usuário Criado!"); toggleGestao(); });
    }

    function carregarBeneficiarios() {
        db.ref('usuarios').on('value', snap => {
            const u = snap.val();
            const sel = document.getElementById('bag-beneficiario');
            sel.innerHTML = '<option value="">Comissão para...</option><option value="Master">Master</option>';
            for(let k in u) sel.innerHTML += `<option value="${u[k].nome}">${u[k].nome}</option>`;
        });
    }

    // VIAGENS E PDF
    db.ref('viagens').on('value', snap => {
        const data = snap.val();
        const container = document.getElementById('lista-viagens-container');
        container.innerHTML = "";
        for(let key in data) {
            const v = data[key];
            const div = document.createElement('div');
            div.className = 'p-row';
            div.innerHTML = `<div style="flex-grow:1"><strong>${v.hora}</strong> - ${v.destino}</div> <span>➔</span>`;
            div.onclick = () => { 
                atualViagemKey = key; 
                document.getElementById('view-menu').style.display='none'; 
                document.getElementById('view-lista').style.display='block';
                document.getElementById('titulo-viagem').innerText = v.hora + " - " + v.destino;
                renderPassageiros(v);
            };
            container.appendChild(div);
        }
        if(atualViagemKey && data[atualViagemKey]) renderPassageiros(data[atualViagemKey]);
    });

    function renderPassageiros(v) {
        const l = document.getElementById('passageiros-lista');
        l.innerHTML = "";
        const pax = v.passageiros ? Object.values(v.passageiros).sort((a,b)=>parseInt(a.polt)-parseInt(b.polt)) : [];
        pax.forEach(p => {
            const div = document.createElement('div');
            div.className = `p-row ${p.ok ? 'ok' : ''}`;
            div.onclick = () => alternarCheck(p.bilhete, p.ok);
            div.innerHTML = `
                <div class="polt-badge">${p.polt}</div>
                <div style="flex-grow:1">
                    <div style="font-weight:700; font-size:13px;">${p.nome}</div>
                    ${p.ok ? `<div class="log-info">✓ por ${p.operador} às ${p.hora_embarque}</div>` : ''}
                </div>
                <button class="btn-bag" onclick="event.stopPropagation(); abrirBagagem(${JSON.stringify(p).replace(/"/g, '&quot;')})">🧳</button>
            `;
            l.appendChild(div);
        });
    }

    // LÓGICA DO PDF (IMPORTANTE PARA CARREGAR O CARRO)
    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        document.getElementById('loader').style.display = 'block';
        const reader = new FileReader();
        reader.onload = async function() {
            try {
                const pdfjsLib = window['pdfjs-dist/build/pdf'];
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const items = textContent.items;
                    
                    // Lógica simplificada de extração baseada na estrutura das imagens enviadas
                    for(let j=0; j<items.length; j++) {
                        let str = items[j].str.trim();
                        let poltM = str.match(/^(\d{1,2})$/); // Procura número da poltrona
                        if(poltM) {
                            let nome = items[j+1] ? items[j+1].str : "Passageiro";
                            let bilhete = items[j+5] ? items[j+5].str : "SB-"+poltM[1];
                            if(bilhete.length > 3) { // Evita lixo
                                db.ref(`viagens/${atualViagemKey}/passageiros/${bilhete}`).update({
                                    polt: poltM[1], nome: nome, bilhete: bilhete, ok: false
                                });
                            }
                        }
                    }
                }
            } catch (err) { alert("Erro no PDF: " + err.message); }
            finally { document.getElementById('loader').style.display = 'none'; e.target.value = ""; }
        };
        reader.readAsArrayBuffer(file);
    });

    // FUNÇÕES DE APOIO
    function alternarCheck(bilhete, status) {
        db.ref(`viagens/${atualViagemKey}/passageiros/${bilhete}`).update({
            ok: !status, operador: !status ? currentUser.nome : null, 
            hora_embarque: !status ? new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : null
        });
    }
    function abrirBagagem(pax) { paxSelecionadoObj = pax; document.getElementById('pax-excesso-info').innerText = pax.nome; document.getElementById('modal-excesso').style.display='flex'; }
    function salvarENotificar() {
        const qtd = document.getElementById('bag-qtd').value;
        const val = document.getElementById('bag-valor').value;
        const ben = document.getElementById('bag-beneficiario').value;
        if(!qtd || !val || !ben) return alert("Preencha tudo!");
        db.ref(`viagens/${atualViagemKey}/passageiros/${paxSelecionadoObj.bilhete}/excesso`).set({qtd, valor: val, beneficiario: ben}).then(() => {
            const msg = `*BAGAGEM:* ${paxSelecionadoObj.nome} (Polt ${paxSelecionadoObj.polt})\nVol: ${qtd} | Valor: R$ ${val}\nComissão: ${ben}\nOperador: ${currentUser.nome}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
            document.getElementById('modal-excesso').style.display='none';
        });
    }
    function irParaMenu() { document.getElementById('view-menu').style.display='block'; document.getElementById('view-lista').style.display='none'; }
    function adicionarViagem() { 
        const h = document.getElementById('input-hora').value; 
        const d = document.getElementById('input-destino').value;
        if(h && d) db.ref('viagens').push({ hora: h, destino: d });
    }
</script>
</body>
</html>
