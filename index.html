<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002d5e">
    <title>Guanabara Check-in PRO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --primary: #002d5e; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --bg: #f3f4f6; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding-bottom: 40px; 
            height: 100vh; /* Tela cheia */
            display: flex;
            flex-direction: column;
        }
        
        /* Cabeçalho Fixo */
        header { 
            background: var(--primary); 
            color: white; 
            padding: 15px; 
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            flex-shrink: 0;
        }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: auto; }
        .btn-logout { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        /* Layout */
        .container { max-width: 500px; margin: auto; padding: 15px; width: 100%; box-sizing: border-box; flex-grow: 1; overflow-y: auto; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        
        /* Contador de Passageiros (Novo) */
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .sb-item { text-align: center; width: 33%; }
        .sb-val { display: block; font-size: 18px; font-weight: bold; color: var(--primary); }
        .sb-lbl { font-size: 11px; color: #64748b; text-transform: uppercase; }
        
        /* Inputs e Botões */
        input, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; text-transform: uppercase; color: white; }
        .btn-blue { background: var(--primary); }
        .btn-red { background: #fee2e2; color: #b91c1c; }
        .btn-zap { background: #25d366; }
        .btn-gray { background: #64748b; }
        
        /* Lista de Passageiros */
        .p-row { display: flex; align-items: center; padding: 12px; background: white; border-radius: 12px; margin-bottom: 8px; border: 1px solid #eee; transition: 0.2s; }
        .p-row.ok { border-left: 6px solid var(--success); background: #f0fdf4; }
        .polt { background: #e2e8f0; min-width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; margin-right: 12px; color: var(--primary); font-size: 18px; }
        .p-info { flex-grow: 1; overflow: hidden; }
        .p-name { font-weight: bold; font-size: 15px; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-bil { font-size: 13px; color: #64748b; margin-top: 2px; }
        
        /* Utilitários */
        .trash { float: right; color: var(--danger); cursor: pointer; padding: 5px; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; background: black; }
        #modal-excesso, #loader { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; flex-direction: column; color: white; }
        
        /* Lista de Operadores */
        .op-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    </style>
</head>
<body>

<div id="view-login" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--primary); color: white; position: absolute; top: 0; width: 100%; z-index: 200;">
    <h1 style="margin-bottom: 5px;">GUANABARA</h1>
    <p style="opacity: 0.8; margin-top: 0;">CHECK-IN PRO</p>
    <div style="width: 80%; max-width: 300px;">
        <input type="text" id="login-mat" placeholder="Matrícula">
        <input type="password" id="login-pass" placeholder="Senha">
        <button class="btn btn-blue" style="background: white; color: var(--primary);" onclick="autenticar()">ENTRAR</button>
    </div>
</div>

<div id="app-content" style="display: none; height: 100%; flex-direction: column;">
    <header>
        <div class="user-row">
            <span style="font-weight: bold; font-size: 16px;">GUANABARA RECIFE</span>
            <button class="btn-logout" onclick="logout()">SAIR</button>
        </div>
        <small id="user-display" style="opacity: 0.8; display: block; margin-top: 5px;"></small>
    </header>

    <div id="view-menu" class="container">
        
        <div id="area-master" class="card" style="display:none; border-top: 4px solid var(--warning);">
            <h3 style="margin:0 0 10px 0; color:var(--primary)">ADMINISTRAÇÃO</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="font-size:12px; color:#666; font-weight:bold;">CRIAR VIAGEM:</label>
                <div style="display: flex; gap: 5px;">
                    <input type="time" id="new-hora" style="width: 35%;">
                    <input type="text" id="new-dest" placeholder="Destino" style="width: 65%;">
                </div>
                <button class="btn btn-blue" style="margin-top:5px; padding: 12px;" onclick="criarViagem()">➕ CRIAR LISTA</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

            <button class="btn btn-gray" style="padding: 12px; font-size: 13px;" onclick="toggleEquipe()">👥 GERENCIAR EQUIPE</button>
            
            <div id="box-equipe" style="display: none; margin-top: 15px; background: #f8fafc; padding: 10px; border-radius: 8px;">
                <h4 style="margin: 0 0 10px 0; font-size: 14px;">Novo Operador:</h4>
                <input type="text" id="cad-nome" placeholder="Nome" style="padding: 10px; font-size: 14px;">
                <input type="text" id="cad-mat" placeholder="Matrícula" style="padding: 10px; font-size: 14px;">
                <input type="text" id="cad-pass" placeholder="Senha" style="padding: 10px; font-size: 14px;">
                <button class="btn btn-blue" style="padding: 10px;" onclick="cadastrarOperador()">SALVAR</button>
                
                <h4 style="margin: 15px 0 5px 0; font-size: 14px;">Operadores Ativos:</h4>
                <div id="lista-ops" style="background: white; border: 1px solid #eee; border-radius: 5px;"></div>
            </div>
        </div>
        
        <h4 style="color:#64748b; margin: 10px 5px;">VIAGENS DISPONÍVEIS:</h4>
        <div id="list-viagens"></div>
    </div>

    <div id="view-detalhe" class="container" style="display:none">
        <button onclick="voltar()" style="background:none; border:none; color:var(--primary); font-weight:bold; cursor:pointer; margin-bottom:10px; font-size:16px;">◀ MENU PRINCIPAL</button>
        
        <div class="card" style="padding: 15px;">
            <h3 id="detalhe-titulo" style="text-align:center; margin:0 0 10px 0; color:var(--primary)"></h3>
            
            <div id="reader"></div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn btn-blue" style="margin:0; font-size:12px;" onclick="document.getElementById('pdf-file').click()">📥 IMPORTAR PDF</button>
                <button class="btn btn-blue" style="margin:0; background:#6366f1; font-size:12px;" onclick="startScan()">📸 LER QR</button>
            </div>
            <button class="btn btn-zap" style="margin-top:10px; font-size:13px;" onclick="finalizarEmbarque()">✅ FINALIZAR EMBARQUE</button>
            <button class="btn btn-red" style="margin-top:10px; font-size:13px;" onclick="limparMapa()">🗑️ LIMPAR LISTA</button>
            
            <input type="file" id="pdf-file" accept="application/pdf" style="display:none">
        </div>

        <div class="status-bar">
            <div class="sb-item">
                <span class="sb-val" id="cnt-total">0</span>
                <span class="sb-lbl">Total</span>
            </div>
            <div class="sb-item" style="border-left:1px solid #eee; border-right:1px solid #eee;">
                <span class="sb-val" style="color:var(--success)" id="cnt-ok">0</span>
                <span class="sb-lbl">Embarcados</span>
            </div>
            <div class="sb-item">
                <span class="sb-val" style="color:var(--danger)" id="cnt-rest">0</span>
                <span class="sb-lbl">Faltam</span>
            </div>
        </div>

        <div id="lista-pax"></div>
    </div>
</div>

<div id="modal-excesso">
    <div class="card" style="width: 85%; color: black;">
        <h3 style="margin-top:0">📦 EXCESSO DE BAGAGEM</h3>
        <p id="ex-pax-nome" style="font-weight:bold; background: #f1f5f9; padding: 10px; border-radius: 8px;"></p>
        <input type="number" id="ex-qtd" placeholder="Qtd Volumes">
        <input type="number" id="ex-val" placeholder="Valor Total R$">
        <select id="ex-ben"></select>
        <button class="btn btn-zap" onclick="zapExcesso()">ENVIAR WHATSAPP 📱</button>
        <button class="btn" style="background:none; color:gray" onclick="document.getElementById('modal-excesso').style.display='none'">CANCELAR</button>
    </div>
</div>

<div id="loader">
    <div style="font-size: 40px;">⏳</div>
    <p>PROCESSANDO...</p>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnjkMAQbs9h2cZNfl0SVhgcdix1A0laL0",
        authDomain: "guanabara-checkin.firebaseapp.com",
        databaseURL: "https://guanabara-checkin-default-rtdb.firebaseio.com",
        projectId: "guanabara-checkin",
        storageBucket: "guanabara-checkin.firebasestorage.app",
        messagingSenderId: "265228574249",
        appId: "1:265228574249:web:abd33b5a15756ebde18638"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let userLogado = null, vKey = null, paxEx = null, scanner = null;

    // --- LOGIN ---
    window.onload = () => {
        const savedUser = localStorage.getItem('userGuana');
        if(savedUser) logar(JSON.parse(savedUser));
        else document.getElementById('view-login').style.display = 'flex';
    };

    function autenticar() {
        const m = document.getElementById('login-mat').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        
        if(m === "c07011946" && p === "guana123") {
            const u = {nome: "Master", mat: m, role: "master"};
            localStorage.setItem('userGuana', JSON.stringify(u));
            logar(u);
            return;
        }

        db.ref('usuarios/'+m).once('value', s => {
            const u = s.val();
            if(u && u.pass === p) {
                const userData = {nome: u.nome, mat: m, role: 'operador'};
                localStorage.setItem('userGuana', JSON.stringify(userData));
                logar(userData);
            } else alert("Dados incorretos!");
        });
    }

    function logar(u) {
        userLogado = u;
        document.getElementById('view-login').style.display = 'none';
        document.getElementById('app-content').style.display = 'flex';
        document.getElementById('user-display').innerText = `Operador: ${u.nome}`;
        
        if(u.role === 'master') {
            document.getElementById('area-master').style.display = 'block';
            listarOperadores();
        }
        
        carregarViagens();
        carregarBeneficiarios();
    }

    function logout() {
        if(confirm("Deseja sair?")) {
            localStorage.removeItem('userGuana');
            location.reload();
        }
    }

    // --- GESTÃO DE OPERADORES (MASTER) ---
    function toggleEquipe() {
        const d = document.getElementById('box-equipe');
        d.style.display = d.style.display === 'none' ? 'block' : 'none';
    }

    function cadastrarOperador() {
        const n = document.getElementById('cad-nome').value;
        const m = document.getElementById('cad-mat').value;
        const p = document.getElementById('cad-pass').value;

        if(n && m && p) {
            db.ref('usuarios/'+m).set({nome: n, mat: m, pass: p, role: 'operador'})
            .then(() => {
                alert("Operador cadastrado!");
                document.getElementById('cad-nome').value="";
                document.getElementById('cad-mat').value="";
                document.getElementById('cad-pass').value="";
                listarOperadores();
            });
        } else alert("Preencha todos os campos");
    }

    function listarOperadores() {
        db.ref('usuarios').once('value', s => {
            const div = document.getElementById('lista-ops');
            div.innerHTML = "";
            s.forEach(child => {
                const u = child.val();
                if(u.role !== 'master') {
                    div.innerHTML += `
                    <div class="op-item">
                        <span>${u.nome} (${u.mat})</span>
                        <span style="color:red; font-weight:bold; cursor:pointer" onclick="delOperador('${u.mat}')">✖</span>
                    </div>`;
                }
            });
        });
    }

    function delOperador(mat) {
        if(confirm("Excluir este operador?")) {
            db.ref('usuarios/'+mat).remove().then(() => listarOperadores());
        }
    }

    // --- PDF INTELIGENTE ---
    document.getElementById('pdf-file').onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        document.getElementById('loader').style.display = 'flex';

        const reader = new FileReader();
        reader.onload = async function() {
            try {
                const typedarray = new Uint8Array(this.result);
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let count = 0;

                for(let i=1; i<=pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const text = await page.getTextContent();
                    const lines = {};
                    
                    text.items.forEach(item => {
                        const y = Math.round(item.transform[5]);
                        if(!lines[y]) lines[y] = [];
                        lines[y].push(item);
                    });

                    for(let y in lines) {
                        const fullLine = lines[y].sort((a,b) => a.transform[4] - b.transform[4])
                                                 .map(it => it.str.trim()).join(" ");
                        
                        const matchPolt = fullLine.match(/^(\d{1,2})\s+/);
                        if(matchPolt) {
                            const polt = matchPolt[1];
                            const matchBil = fullLine.match(/\b(\d{6})\b/); 
                            
                            if(matchBil) {
                                const bil = matchBil[1];
                                let nome = fullLine.replace(/^(\d{1,2})\s+/, "").split(/\d/)[0].trim();
                                
                                if(nome.length > 3 && !nome.includes("SUBTOTAL")) {
                                    db.ref(`viagens/${vKey}/pax/${bil}`).update({
                                        polt: polt, nome: nome.toUpperCase(), bilhete: bil, ok: false
                                    });
                                    count++;
                                }
                            }
                        }
                    }
                }
                alert(count > 0 ? `${count} passageiros importados!` : "Nenhum dado encontrado.");
            } catch (err) { alert("Erro no PDF: " + err.message); } 
            finally { document.getElementById('loader').style.display = 'none'; e.target.value = ""; }
        };
        reader.readAsArrayBuffer(file);
    };

    // --- RENDERIZAÇÃO DA LISTA ---
    function renderPax(data) {
        const list = document.getElementById('lista-pax');
        list.innerHTML = "";
        
        let total = 0, ok = 0;

        if(data) {
            const arr = Object.values(data);
            total = arr.length;
            ok = arr.filter(p => p.ok).length;

            arr.sort((a,b)=>parseInt(a.polt) - parseInt(b.polt)).forEach(p => {
                const div = document.createElement('div');
                div.className = `p-row ${p.ok ? 'ok' : ''}`;
                div.innerHTML = `
                    <div class="polt">${p.polt}</div>
                    <div class="p-info" onclick="check('${p.bilhete}', ${p.ok})">
                        <div class="p-name">${p.nome}</div>
                        <div class="p-bil">Bilhete: ${p.bilhete}</div>
                    </div>
                    <button class="btn" style="width:50px; height:40px; background:var(--warning); margin:0; padding:0" onclick="modalEx('${p.bilhete}', '${p.nome}', event)">🧳</button>
                `;
                list.appendChild(div);
            });
        }

        // Atualiza os contadores
        document.getElementById('cnt-total').innerText = total;
        document.getElementById('cnt-ok').innerText = ok;
        document.getElementById('cnt-rest').innerText = total - ok;
    }

    function check(bil, status) {
        db.ref(`viagens/${vKey}/pax/${bil}`).update({
            ok: !status,
            operador: !status ? userLogado.nome : null,
            hora: !status ? new Date().toLocaleTimeString('pt-BR') : null
        });
    }

    // --- FUNÇÕES GERAIS ---
    function carregarViagens() {
        db.ref('viagens').on('value', s => {
            const data = s.val();
            const container = document.getElementById('list-viagens');
            container.innerHTML = "";
            for(let k in data) {
                const v = data[k];
                container.innerHTML += `
                <div class="card" style="padding:15px; display:flex; justify-content:space-between; align-items:center;">
                    <div onclick="abrirViagem('${k}', '${v.hora}', '${v.dest}')" style="cursor:pointer; flex-grow:1">
                        <div style="font-size:18px; font-weight:bold; color:var(--primary);">${v.hora}</div>
                        <div style="font-size:14px; color:#333;">${v.dest}</div>
                    </div>
                    ${userLogado.role === 'master' ? `<span class="trash" onclick="apagarViagem('${k}')">🗑️</span>` : ''}
                </div>`;
            }
        });
    }

    function criarViagem() {
        const h = document.getElementById('new-hora').value;
        const d = document.getElementById('new-dest').value;
        if(h && d) { db.ref('viagens').push({hora: h, dest: d.toUpperCase()}); document.getElementById('new-dest').value=""; }
    }
    function apagarViagem(k) { if(confirm("Apagar viagem?")) db.ref('viagens/'+k).remove(); }
    function abrirViagem(k, h, d) {
        vKey = k;
        document.getElementById('view-menu').style.display='none';
        document.getElementById('view-detalhe').style.display='flex'; // Flex para layout
        document.getElementById('view-detalhe').style.flexDirection='column';
        document.getElementById('detalhe-titulo').innerText = `${h} - ${d}`;
        db.ref('viagens/'+k+'/pax').on('value', s => renderPax(s.val()));
    }
    function voltar() {
        if(scanner) scanner.stop().catch(()=>{});
        document.getElementById('reader').style.display = 'none';
        document.getElementById('view-menu').style.display='block';
        document.getElementById('view-detalhe').style.display='none';
    }
    function limparMapa() { if(confirm("Limpar lista?")) db.ref(`viagens/${vKey}/pax`).remove(); }

    function finalizarEmbarque() {
        db.ref(`viagens/${vKey}`).once('value', s => {
            const v = s.val();
            const p = Object.values(v.pax || {});
            const ok = p.filter(x => x.ok).length;
            const msg = `*🚌 RESUMO DE EMBARQUE*\n---------------------------\n🗓️ *Viagem:* ${v.hora} - ${v.dest}\n✅ *Embarcados:* ${ok}\n❌ *Faltam:* ${p.length - ok}\n👥 *Total:* ${p.length}\n---------------------------\n🆔 *Operador:* ${userLogado.nome}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        });
    }

    function modalEx(bil, nome, e) {
        e.stopPropagation(); paxEx = {bil, nome};
        document.getElementById('ex-pax-nome').innerText = nome;
        document.getElementById('modal-excesso').style.display='flex';
    }

    function zapExcesso() {
        const q = document.getElementById('ex-qtd').value, v = document.getElementById('ex-val').value, b = document.getElementById('ex-ben').value;
        const msg = `*📦 EXCESSO DE BAGAGEM*\n👤 *Pax:* ${paxEx.nome}\n🎫 *Bilhete:* ${paxEx.bil}\n📦 *Volumes:* ${q}\n💰 *Valor:* R$ ${v}\n🏅 *Comissão:* ${b}\n🆔 *Operador:* ${userLogado.nome}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        document.getElementById('modal-excesso').style.display='none';
    }

    function carregarBeneficiarios() {
        db.ref('usuarios').on('value', s => {
            const sel = document.getElementById('ex-ben');
            sel.innerHTML = '<option value="">Comissão para...</option><option value="Master">Master</option>';
            s.forEach(c => sel.innerHTML += `<option value="${c.val().nome}">${c.val().nome}</option>`);
        });
    }

    function startScan() {
        const r = document.getElementById('reader'); r.style.display = 'block';
        scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
            const b = txt.match(/\d{6}/);
            if(b) {
                db.ref(`viagens/${vKey}/pax/${b[0]}`).update({ok:true, operador:userLogado.nome, hora:new Date().toLocaleTimeString('pt-BR')});
                alert(`✅ Bilhete ${b[0]} confirmado!`);
                scanner.stop(); r.style.display='none';
            }
        });
    }
</script>
</body>
</html>
