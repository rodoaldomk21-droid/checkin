<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guanabara Cloud Sync</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --blue: #004a99; --green: #28a745; --red: #dc3545; --bg: #f1f5f9; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        header { background: var(--blue); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top:0; z-index: 100; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .btn { border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; color: white; font-size: 16px; margin-top: 10px; display: block; text-align: center; text-decoration: none; }
        .btn-blue { background: var(--blue); }
        .btn-qr { background: #6b21a8; }
        .btn-del { background: #fee2e2; color: var(--red); border: none; padding: 8px; border-radius: 8px; position: absolute; right: 15px; top: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { padding: 15px; border-radius: 12px; text-align: center; color: white; font-weight: bold; }
        .p-row { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .p-row.ok { background: #e6ffed; border-left: 6px solid var(--green); }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 15px; background: #000; display: none; }
    </style>
</head>
<body>

<header>GUANABARA CLOUD - RECIFE</header>

<div id="view-menu" class="container">
    <div class="card">
        <h3>Nova Viagem</h3>
        <input type="time" id="input-hora" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px;">
        <input type="text" id="input-destino" placeholder="Destino (ex: Fortaleza)" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;">
        <button class="btn btn-blue" onclick="adicionarViagem()">CRIAR NO CLOUD</button>
    </div>
    <div id="lista-viagens-container"></div>
</div>

<div id="view-lista" class="container" style="display:none">
    <button onclick="irParaMenu()" style="background:none; border:none; color:var(--blue); font-weight:bold; margin-bottom:15px;">← VOLTAR</button>
    
    <div class="stats-grid">
        <div class="stat-card" style="background:var(--green)">EMBARCADOS: <span id="txt-ok">0</span></div>
        <div class="stat-card" style="background:var(--red)">FALTAM: <span id="txt-faltam">0</span></div>
    </div>

    <div class="card">
        <h2 id="titulo-viagem" style="margin-top:0"></h2>
        <div id="reader"></div>
        <button class="btn btn-qr" onclick="toggleScanner()">📷 ESCANEAR QR CODE</button>
        <button class="btn btn-blue" onclick="document.getElementById('file-input').click()">📥 SOMAR PDF (DD)</button>
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
    </div>
    <div id="passageiros-lista"></div>
</div>

<script>
    // --- CONFIGURAÇÃO FIREBASE (SUBSTITUA PELOS SEUS DADOS) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAnjkMAQbs9h2cZNfl0SVhgcdix1A0laL0",
        databaseURL: "https://guanabara-checkin-default-rtdb.firebaseio.com",
        projectId: "guanabara-checkin"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let atualViagemKey = null;
    const audioBip = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');

    // Sincronizar Menu Principal automaticamente
    db.ref('viagens').on('value', (snapshot) => {
        const data = snapshot.val();
        renderMenu(data);
        if (atualViagemKey) renderPassageiros(data[atualViagemKey]);
    });

    function adicionarViagem() {
        const h = document.getElementById('input-hora').value;
        const d = document.getElementById('input-destino').value;
        if(!h || !d) return;
        db.ref('viagens').push({ hora: h, destino: d, passageiros: [] });
    }

    function excluirViagem(key, event) {
        event.stopPropagation();
        if(confirm("Excluir de todos os dispositivos?")) db.ref('viagens/' + key).remove();
    }

    function renderMenu(data) {
        const c = document.getElementById('lista-viagens-container');
        c.innerHTML = "";
        for (let key in data) {
            const v = data[key];
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => abrirViagem(key, v);
            div.innerHTML = `
                <button class="btn-del" onclick="excluirViagem('${key}', event)">🗑️</button>
                <strong>${v.hora} - ${v.destino}</strong><br>
                <small>${v.passageiros ? Object.keys(v.passageiros).length : 0} passageiros</small>
            `;
            c.appendChild(div);
        }
    }

    function abrirViagem(key, v) {
        atualViagemKey = key;
        document.getElementById('view-menu').style.display = 'none';
        document.getElementById('view-lista').style.display = 'block';
        document.getElementById('titulo-viagem').innerText = v.hora + " - " + v.destino;
        renderPassageiros(v);
    }

    function irParaMenu() {
        atualViagemKey = null;
        document.getElementById('view-menu').style.display = 'block';
        document.getElementById('view-lista').style.display = 'none';
    }

    function toggle(pKey, statusAtual) {
        db.ref(`viagens/${atualViagemKey}/passageiros/${pKey}`).update({ ok: !statusAtual });
    }

    function renderPassageiros(v) {
        if (!v || !v.passageiros) {
            document.getElementById('passageiros-lista').innerHTML = "";
            document.getElementById('txt-ok').innerText = "0";
            document.getElementById('txt-faltam').innerText = "0";
            return;
        }
        const l = document.getElementById('passageiros-lista');
        l.innerHTML = "";
        const paxArray = Object.keys(v.passageiros).map(k => ({k, ...v.passageiros[k]}));
        paxArray.sort((a,b) => parseInt(a.polt) - parseInt(b.polt));

        let okCount = 0;
        paxArray.forEach(p => {
            if(p.ok) okCount++;
            const div = document.createElement('div');
            div.className = `p-row ${p.ok ? 'ok' : ''}`;
            div.onclick = () => toggle(p.k, p.ok);
            div.innerHTML = `
                <input type="checkbox" ${p.ok ? 'checked' : ''} style="width:20px;height:20px;">
                <div style="margin-left:10px"><strong>${p.polt} - ${p.nome}</strong><br><small>${p.bilhete}</small></div>
            `;
            l.appendChild(div);
        });
        document.getElementById('txt-ok').innerText = okCount;
        document.getElementById('txt-faltam').innerText = paxArray.length - okCount;
    }

    // A lógica do PDF e Scanner permanece a mesma, mas usando db.ref().push() e .update()
    // [Omitido por brevidade, mas deve ser integrada com db.ref]
</script>
</body>
</html>
