<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guanabara Check-in PRO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #002d5e;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text-main: #1e293b;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--text-main); }
        header { background: var(--primary); color: white; padding: 18px; text-align: center; font-weight: 700; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .container { max-width: 480px; margin: auto; padding: 16px; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.05); }
        
        input, select { width: 100%; padding: 15px; margin-bottom: 12px; border: 2px solid #e5e7eb; border-radius: 14px; font-size: 16px; box-sizing: border-box; text-align: center; font-family: inherit; }
        
        .btn { border: none; padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; font-size: 14px; text-transform: uppercase; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-bag { background: var(--warning); color: white; padding: 10px; font-size: 14px; width: 50px; border-radius: 10px; }
        .btn-zap { background: #25d366; color: white; }

        .p-row { display: flex; align-items: center; padding: 15px; background: white; border-radius: 16px; margin-bottom: 10px; border: 1px solid #edf2f7; }
        .p-row.ok { border-left: 6px solid var(--success); }
        .polt-badge { background: #f1f5f9; color: var(--primary); width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 700; margin-right: 12px; }

        #modal-excesso { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; }
        .bag-tag { background: #fffbeb; color: #92400e; font-size: 11px; padding: 6px; border-radius: 8px; font-weight: 700; margin-top: 8px; border: 1px dashed #f59e0b; display: block; }
        .user-tag { font-size: 11px; color: #cbd5e1; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div id="view-login" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--primary);">
    <h2 style="color: white; margin-bottom: 20px;">GUANABARA RECIFE</h2>
    <div class="container" style="width: 100%;">
        <input type="text" id="login-matricula" placeholder="Matrícula">
        <input type="password" id="login-senha" placeholder="Senha">
        <button class="btn" style="background:white; color:var(--primary)" onclick="autenticar()">ENTRAR</button>
    </div>
</div>

<div id="app-content" style="display: none;">
    <header>GUANABARA RECIFE <span id="display-user" class="user-tag"></span></header>

    <div id="view-menu" class="container">
        <div id="area-master" class="card" style="display: none;">
            <h3 style="text-align:center; margin-top:0">NOVA VIAGEM</h3>
            <input type="time" id="input-hora">
            <input type="text" id="input-destino" placeholder="Destino">
            <button class="btn btn-blue" onclick="adicionarViagem()">CRIAR LISTA</button>
        </div>
        <div id="lista-viagens-container"></div>
    </div>

    <div id="view-lista" class="container" style="display:none">
        <button onclick="irParaMenu()" style="background:none; border:none; font-weight:700; color:var(--primary); margin-bottom:15px;">◀ VOLTAR</button>
        <h3 id="titulo-viagem" style="text-align:center"></h3>
        <div id="passageiros-lista"></div>
    </div>
</div>

<div id="modal-excesso">
    <div class="card" style="width: 90%; max-width: 400px; padding: 25px;">
        <h3 style="margin-top:0; color:var(--warning)">📦 EXCESSO DE BAGAGEM</h3>
        <p id="pax-excesso-info" style="font-size:14px; font-weight:700; background:#f8fafc; padding:10px; border-radius:8px;"></p>
        
        <label style="font-size:12px; font-weight:700;">VOLUMES:</label>
        <input type="number" id="bag-qtd" placeholder="0">
        
        <label style="font-size:12px; font-weight:700;">VALOR TOTAL R$:</label>
        <input type="number" id="bag-valor" placeholder="0.00">
        
        <label style="font-size:12px; font-weight:700;">COMISSÃO PARA:</label>
        <select id="bag-beneficiario"></select>
        
        <button class="btn btn-zap" onclick="salvarENotificar()">SALVAR E ENVIAR ZAP 📱</button>
        <button class="btn" style="background:none; color:var(--danger); margin-top:10px" onclick="document.getElementById('modal-excesso').style.display='none'">FECHAR</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnjkMAQbs9h2cZNfl0SVhgcdix1A0laL0",
        authDomain: "guanabara-checkin.firebaseapp.com",
        databaseURL: "https://guanabara-checkin-default-rtdb.firebaseio.com",
        projectId: "guanabara-checkin",
        storageBucket: "guanabara-checkin.firebasestorage.app",
        messagingSenderId: "265228574249",
        appId: "1:265228574249:web:abd33b5a15756ebde18638"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = null;
    let atualViagemKey = null;
    let paxSelecionadoObj = null;

    function autenticar() {
        const mat = document.getElementById('login-matricula').value.trim();
        const pass = document.getElementById('login-senha').value.trim();
        if(mat === "c07011946" && pass === "guana123") {
            entrarApp({ nome: "Master", matricula: "c07011946", role: "master" });
        } else {
            db.ref('usuarios/' + mat).once('value', snap => {
                const u = snap.val();
                if(u && u.senha === pass) entrarApp(u); else alert("Acesso negado!");
            });
        }
    }

    function entrarApp(user) {
        currentUser = user;
        document.getElementById('view-login').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('display-user').innerText = `Logado: ${user.nome}`;
        if(user.role === 'master') document.getElementById('area-master').style.display = 'block';
        carregarBeneficiarios();
    }

    function carregarBeneficiarios() {
        db.ref('usuarios').on('value', snap => {
            const users = snap.val();
            const select = document.getElementById('bag-beneficiario');
            select.innerHTML = '<option value="">Selecione...</option><option value="Master">Master</option>';
            for(let k in users) select.innerHTML += `<option value="${users[k].nome}">${users[k].nome}</option>`;
        });
    }

    function abrirBagagem(pax, e) {
        e.stopPropagation();
        paxSelecionadoObj = pax;
        document.getElementById('pax-excesso-info').innerText = `Poltrona: ${pax.polt} - ${pax.nome}`;
        document.getElementById('modal-excesso').style.display = 'flex';
    }

    function salvarENotificar() {
        const qtd = document.getElementById('bag-qtd').value;
        const valor = document.getElementById('bag-valor').value;
        const ben = document.getElementById('bag-beneficiario').value;
        const v = document.getElementById('titulo-viagem').innerText;

        if(!qtd || !valor || !ben) return alert("Preencha todos os campos!");

        const dadosExcesso = {
            qtd, valor, beneficiario: ben,
            data: new Date().toLocaleDateString(),
            hora: new Date().toLocaleTimeString()
        };

        // Salva no Firebase
        db.ref(`viagens/${atualViagemKey}/passageiros/${paxSelecionadoObj.bilhete}/excesso`).set(dadosExcesso).then(() => {
            document.getElementById('modal-excesso').style.display = 'none';
            
            // Formata mensagem para o WhatsApp
            let msg = `*🏷️ REGISTRO DE EXCESSO DE BAGAGEM*\n`;
            msg += `----------------------------------------\n`;
            msg += `🚌 *Viagem:* ${v}\n`;
            msg += `👤 *Passageiro:* ${paxSelecionadoObj.nome}\n`;
            msg += `💺 *Poltrona:* ${paxSelecionadoObj.polt}\n`;
            msg += `📦 *Volumes:* ${qtd}\n`;
            msg += `💰 *Valor Pago:* R$ ${valor}\n`;
            msg += `🏅 *Comissão:* ${ben}\n`;
            msg += `----------------------------------------\n`;
            msg += `🆔 *Operador:* ${currentUser.nome}\n`;
            msg += `⏰ *Data/Hora:* ${dadosExcesso.data} às ${dadosExcesso.hora}`;

            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        });
    }

    // LISTAGENS E VIAGENS
    db.ref('viagens').on('value', snap => {
        const data = snap.val();
        const container = document.getElementById('lista-viagens-container');
        container.innerHTML = "";
        for(let key in data) {
            const v = data[key];
            const div = document.createElement('div');
            div.className = 'card';
            div.style.padding = '15px';
            div.innerHTML = `<strong>${v.hora}</strong> - ${v.destino}`;
            div.onclick = () => { 
                atualViagemKey = key; 
                document.getElementById('view-menu').style.display='none'; 
                document.getElementById('view-lista').style.display='block'; 
                document.getElementById('titulo-viagem').innerText = v.hora + " - " + v.destino; 
            };
            container.appendChild(div);
        }
        if(atualViagemKey && data[atualViagemKey]) renderPassageiros(data[atualViagemKey]);
    });

    function renderPassageiros(v) {
        const l = document.getElementById('passageiros-lista');
        l.innerHTML = "";
        const pax = v.passageiros ? Object.values(v.passageiros).sort((a,b)=>parseInt(a.polt)-parseInt(b.polt)) : [];
        pax.forEach(p => {
            const div = document.createElement('div');
            div.className = `p-row ${p.ok ? 'ok' : ''}`;
            div.onclick = () => alternarCheck(p.bilhete, p.ok);
            div.innerHTML = `
                <div class="polt-badge">${p.polt}</div>
                <div style="flex-grow:1">
                    <div style="font-weight:700; font-size:14px;">${p.nome}</div>
                    ${p.excesso ? `<div class="bag-tag">🧳 EXCESSO: ${p.excesso.qtd} vol. - R$ ${p.excesso.valor}</div>` : ''}
                </div>
                <button class="btn-bag" onclick="abrirBagagem(${JSON.stringify(p).replace(/"/g, '&quot;')}, event)">🧳</button>
            `;
            l.appendChild(div);
        });
    }

    async function alternarCheck(bilhete, status) {
        if(status && !confirm("Desmarcar passageiro?")) return;
        db.ref(`viagens/${atualViagemKey}/passageiros/${bilhete}`).update({
            ok: !status,
            operador: !status ? currentUser.nome : null,
            hora_embarque: !status ? new Date().toLocaleTimeString() : null
        });
    }

    function irParaMenu() { document.getElementById('view-menu').style.display='block'; document.getElementById('view-lista').style.display='none'; atualViagemKey = null; }
    function adicionarViagem() { const h = document.getElementById('input-hora').value; const d = document.getElementById('input-destino').value; if(h && d) db.ref('viagens').push({hora: h, destino: d, passageiros: {}}); }
</script>
</body>
</html>
