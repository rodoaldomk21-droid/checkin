<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guanabara Check-in PRO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --primary: #002d5e; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --bg: #f3f4f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn { border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .btn-zap { background: #25d366; color: white; }
        .p-row { display: flex; align-items: center; padding: 12px; background: white; border-radius: 12px; margin-bottom: 8px; border: 1px solid #eee; }
        .p-row.ok { border-left: 5px solid var(--success); background: #f0fdf4; }
        .polt { background: #e2e8f0; min-width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 5px; font-weight: bold; margin-right: 12px; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 10px; display: none; }
        #modal-excesso { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="view-login" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--primary); color: white;">
    <h2>GUANABARA RECIFE</h2>
    <div class="container" style="width: 90%;">
        <input type="text" id="login-mat" placeholder="Matrícula">
        <input type="password" id="login-pass" placeholder="Senha">
        <button class="btn" style="background:white; color:var(--primary)" onclick="autenticar()">ENTRAR</button>
    </div>
</div>

<div id="app-content" style="display: none;">
    <header>GUANABARA RECIFE <br> <small id="user-info"></small></header>

    <div id="view-menu" class="container">
        <div id="area-master" class="card" style="display:none">
            <h3 style="margin-top:0">PROGRAMAR VIAGEM</h3>
            <input type="time" id="new-hora">
            <input type="text" id="new-dest" placeholder="Destino">
            <button class="btn btn-blue" onclick="criarViagem()">➕ CRIAR LISTA</button>
            <button class="btn" style="background:#64748b; color:white" onclick="toggleUserAdm()">👥 CADASTRAR OPERADOR</button>
            
            <div id="user-adm" style="display:none; margin-top:15px;">
                <input type="text" id="adm-nome" placeholder="Nome">
                <input type="text" id="adm-mat" placeholder="Matrícula">
                <input type="password" id="adm-pass" placeholder="Senha">
                <button class="btn btn-blue" onclick="salvarOperador()">CADASTRAR</button>
            </div>
        </div>
        <div id="list-viagens"></div>
    </div>

    <div id="view-detalhe" class="container" style="display:none">
        <button onclick="voltar()" style="background:none; border:none; color:var(--primary); font-weight:bold; cursor:pointer; margin-bottom:10px;">◀ VOLTAR</button>
        <div class="card">
            <h3 id="detalhe-titulo" style="text-align:center; margin-top:0"></h3>
            <div id="reader"></div>
            <button class="btn" style="background:#6366f1; color:white" onclick="startScan()">📸 LER QR CODE</button>
            <button class="btn btn-blue" onclick="document.getElementById('pdf-file').click()">📥 IMPORTAR PDF</button>
            <button class="btn btn-zap" onclick="finalizarEmbarque()">✅ FINALIZAR EMBARQUE (ZAP)</button>
            <button class="btn btn-red" onclick="limparMapa()">🗑️ LIMPAR MAPA</button>
            <input type="file" id="pdf-file" accept="application/pdf" style="display:none">
        </div>
        <div id="lista-pax"></div>
    </div>
</div>

<div id="modal-excesso">
    <div class="card" style="width: 85%;">
        <h3>📦 EXCESSO DE BAGAGEM</h3>
        <p id="ex-pax-nome" style="font-weight:bold"></p>
        <input type="number" id="ex-qtd" placeholder="Volumes">
        <input type="number" id="ex-val" placeholder="Valor R$">
        <select id="ex-ben"></select>
        <button class="btn btn-zap" onclick="zapExcesso()">SALVAR E ENVIAR ZAP 📱</button>
        <button class="btn" onclick="document.getElementById('modal-excesso').style.display='none'">CANCELAR</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnjkMAQbs9h2cZNfl0SVhgcdix1A0laL0",
        authDomain: "guanabara-checkin.firebaseapp.com",
        databaseURL: "https://guanabara-checkin-default-rtdb.firebaseio.com",
        projectId: "guanabara-checkin",
        storageBucket: "guanabara-checkin.firebasestorage.app",
        messagingSenderId: "265228574249",
        appId: "1:265228574249:web:abd33b5a15756ebde18638"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let userLogado = null, vKey = null, paxEx = null, scanner = null;

    function autenticar() {
        const m = document.getElementById('login-mat').value;
        const p = document.getElementById('login-pass').value;
        if(m === "c07011946" && p === "guana123") logar({nome: "Master", mat: m, role: "master"});
        else db.ref('usuarios/'+m).once('value', s => {
            const u = s.val();
            if(u && u.pass === p) logar(u); else alert("Erro!");
        });
    }

    function logar(u) {
        userLogado = u;
        document.getElementById('view-login').style.display='none';
        document.getElementById('app-content').style.display='block';
        document.getElementById('user-info').innerText = "Logado: " + u.nome;
        if(u.role === 'master') document.getElementById('area-master').style.display='block';
        carregarBeneficiarios(); carregarViagens();
    }

    function carregarViagens() {
        db.ref('viagens').on('value', s => {
            const data = s.val();
            const container = document.getElementById('list-viagens');
            container.innerHTML = "";
            for(let k in data) {
                const v = data[k];
                const div = document.createElement('div');
                div.className = 'card';
                div.style.display = 'flex'; div.style.justifyContent = 'space-between';
                div.innerHTML = `<div onclick="abrirViagem('${k}', {hora:'${v.hora}', dest:'${v.dest}'})" style="flex-grow:1"><strong>${v.hora}</strong> - ${v.dest}</div>
                ${userLogado.role==='master' ? `<span onclick="apagarViagem('${k}')">🗑️</span>` : ''}`;
                container.appendChild(div);
            }
        });
    }

    function abrirViagem(k, v) {
        vKey = k;
        document.getElementById('view-menu').style.display='none';
        document.getElementById('view-detalhe').style.display='block';
        document.getElementById('detalhe-titulo').innerText = v.hora + " - " + v.dest;
        db.ref('viagens/'+k+'/pax').on('value', s => renderPax(s.val()));
    }

    function renderPax(data) {
        const list = document.getElementById('lista-pax');
        list.innerHTML = "";
        if(!data) return;
        Object.values(data).sort((a,b)=>a.polt - b.polt).forEach(p => {
            const div = document.createElement('div');
            div.className = `p-row ${p.ok ? 'ok' : ''}`;
            div.innerHTML = `<div class="polt">${p.polt}</div>
                <div style="flex-grow:1" onclick="check('${p.bilhete}', ${p.ok})">
                    <div style="font-weight:bold; font-size:14px">${p.nome}</div>
                    <div style="font-size:11px; color:#666">${p.bilhete}</div>
                </div>
                <button class="btn" style="width:40px; background:var(--warning); margin:0" onclick="modalEx('${p.bilhete}', '${p.nome}', event)">🧳</button>`;
            list.appendChild(div);
        });
    }

    function finalizarEmbarque() {
        db.ref(`viagens/${vKey}`).once('value', s => {
            const v = s.val();
            const p = Object.values(v.pax || {});
            const ok = p.filter(x => x.ok).length;
            const total = p.length;
            const msg = `*✅ FINALIZAÇÃO DE EMBARQUE*\n----------------------------\n*🚌 Viagem:* ${v.hora} - ${v.dest}\n*✅ Embarcados:* ${ok}\n*❌ Faltas:* ${total - ok}\n*📋 Total Carro:* ${total}\n*🆔 Operador:* ${userLogado.nome}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        });
    }

    function zapExcesso() {
        const q = document.getElementById('ex-qtd').value, v = document.getElementById('ex-val').value, b = document.getElementById('ex-ben').value;
        if(!q || !v || !b) return alert("Erro");
        const msg = `*📦 EXCESSO:* ${paxEx.nome}\n*🎫 Bilhete:* ${paxEx.bil}\n*📦 Vols:* ${q} | *💰 Valor:* R$ ${v}\n*🏅 Comis:* ${b}\n*🆔 Operador:* ${userLogado.nome}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        document.getElementById('modal-excesso').style.display='none';
    }

    function check(bil, status) {
        db.ref(`viagens/${vKey}/pax/${bil}`).update({ ok: !status, operador: !status ? userLogado.nome : null });
    }

    function apagarViagem(k) { if(confirm("Excluir horário?")) db.ref('viagens/'+k).remove(); }
    
    function limparMapa() { if(confirm("Limpar mapa?")) db.ref(`viagens/${vKey}/pax`).remove(); }

    function voltar() { document.getElementById('view-menu').style.display='block'; document.getElementById('view-detalhe').style.display='none'; }
    
    function criarViagem() {
        const h = document.getElementById('new-hora').value, d = document.getElementById('new-dest').value;
        if(h && d) db.ref('viagens').push({hora: h, dest: d});
    }

    // PDF RESTAURADO
    document.getElementById('pdf-file').onchange = async (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            for(let i=1; i<=pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const text = await page.getTextContent();
                const items = text.items;
                for(let j=0; j<items.length; j++) {
                    const str = items[j].str.trim();
                    if(str.match(/^\d{1,2}$/)) {
                        const nome = items[j+1] ? items[j+1].str.trim() : "";
                        const bil = items[j+5] ? items[j+5].str.trim() : "SB-"+str;
                        if(nome.length > 3) db.ref(`viagens/${vKey}/pax/${bil}`).update({polt: str, nome: nome, bilhete: bil, ok: false});
                    }
                }
            }
        };
        reader.readAsArrayBuffer(file);
    };

    function toggleUserAdm() { document.getElementById('user-adm').style.display = 'block'; }
    function salvarOperador() {
        const n = document.getElementById('adm-nome').value, m = document.getElementById('adm-mat').value, p = document.getElementById('adm-pass').value;
        db.ref('usuarios/'+m).set({nome: n, mat: m, pass: p, role: 'operador'}).then(()=>alert("Ok"));
    }
    function carregarBeneficiarios() {
        db.ref('usuarios').on('value', s => {
            const u = s.val(); const sel = document.getElementById('ex-ben');
            sel.innerHTML = '<option value="Master">Master</option>';
            for(let k in u) sel.innerHTML += `<option value="${u[k].nome}">${u[k].nome}</option>`;
        });
    }
    function startScan() {
        const r = document.getElementById('reader'); r.style.display = 'block';
        scanner = new Html5Qrcode("reader");
        scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
            const b = txt.match(/\d{6}/);
            if(b) { db.ref(`viagens/${vKey}/pax/${b[0]}`).update({ok:true, operador:userLogado.nome}); scanner.stop(); r.style.display='none'; }
        });
    }
    function modalEx(bil, nome, e) { e.stopPropagation(); paxEx = {bil, nome}; document.getElementById('ex-pax-nome').innerText = nome; document.getElementById('modal-excesso').style.display='flex'; }
</script>
</body>
</html>
