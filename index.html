<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guanabara Check-in PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --blue: #004a99; --green: #28a745; --red: #dc3545; --bg: #f1f5f9; --wsapp: #25d366; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        header { background: var(--blue); color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; position: relative; }
        .btn { border: none; padding: 16px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; color: white; font-size: 16px; margin-top: 10px; display: block; text-align: center; text-decoration: none; }
        .btn-blue { background: var(--blue); }
        .btn-qr { background: #6b21a8; }
        .btn-whatsapp { background: var(--wsapp); }
        .btn-delete-viagem { position: absolute; top: 15px; right: 15px; background: #fee2e2; border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: var(--red); font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { padding: 15px; border-radius: 12px; text-align: center; color: white; font-weight: bold; }
        .p-row { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #eee; cursor: pointer; }
        .p-row.ok { background: #e6ffed; border-left: 6px solid var(--green); }
        .p-row.caxanga { border-right: 6px solid #ff9800; background: #fffaf0; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 15px; background: #000; display: none; }
        #loader { display:none; text-align:center; padding: 10px; color: var(--blue); font-weight: bold; }
        input.input-small { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

<header>GUANABARA - RECIFE</header>

<div id="view-menu" class="container">
    <div class="card">
        <h3>Nova Viagem</h3>
        <input type="time" id="input-hora" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px;">
        <input type="text" id="input-destino" placeholder="Destino (ex: Fortaleza)" style="width:100%; padding:12px; border:1px solid #ccc; border-radius:8px;">
        <button class="btn btn-blue" onclick="adicionarViagem()">CRIAR LISTA</button>
    </div>
    <div id="lista-viagens-container"></div>
</div>

<div id="view-lista" class="container" style="display:none">
    <button onclick="irParaMenu()" style="background:none; border:none; color:var(--blue); font-weight:bold; margin-bottom:15px; cursor:pointer;">← VOLTAR</button>
    
    <div class="stats-grid">
        <div class="stat-card" style="background: var(--green);">EMBARCADOS: <span id="txt-count-ok">0</span></div>
        <div class="stat-card" style="background: var(--red);">NÃO EMBARCADO: <span id="txt-count-pending">0</span></div>
    </div>

    <div class="card">
        <h2 id="titulo-viagem" style="margin-top:0; margin-bottom:10px;"></h2>
        
        <div id="div-caruaru" style="display:none; margin-bottom:15px;">
            <label style="font-size: 12px; font-weight: bold; color: #666;">PASSAGEIROS DE CARUARU (TRÂNSITO):</label>
            <input type="number" id="input-caruaru" class="input-small" placeholder="Ex: 15" onchange="salvarCaruaru()">
        </div>
        
        <div id="reader" style="margin-top:15px;"></div>
        <button class="btn btn-qr" onclick="toggleScanner()">📷 ESCANEAR QR CODE</button>
        <button class="btn btn-blue" onclick="document.getElementById('file-input').click()">📥 CARREGAR PDF</button>
        <button class="btn" style="background: var(--red);" onclick="limparLista()">🗑️ LIMPAR PASSAGEIROS</button>
        
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
        <div id="loader">⚙️ PROCESSANDO PDF... AGUARDE.</div>
    </div>

    <div id="passageiros-lista"></div>
    <div id="acoes-lista" style="display:none">
        <button class="btn btn-whatsapp" onclick="enviarWhatsApp()">📱 RESUMO WHATSAPP</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAnjkMAQbs9h2cZNfl0SVhgcdix1A0laL0",
        authDomain: "guanabara-checkin.firebaseapp.com",
        databaseURL: "https://guanabara-checkin-default-rtdb.firebaseio.com",
        projectId: "guanabara-checkin",
        storageBucket: "guanabara-checkin.firebasestorage.app",
        messagingSenderId: "265228574249",
        appId: "1:265228574249:web:abd33b5a15756ebde18638"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let atualViagemKey = null;
    let html5QrCode = null;
    const audioBip = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');

    db.ref('viagens').on('value', (snapshot) => {
        const data = snapshot.val();
        renderMenu(data);
        if (atualViagemKey && data && data[atualViagemKey]) {
            renderPassageiros(data[atualViagemKey]);
            document.getElementById('input-caruaru').value = data[atualViagemKey].caruaru || "";
        }
    });

    function adicionarViagem() {
        const h = document.getElementById('input-hora').value;
        const d = document.getElementById('input-destino').value;
        if(!h || !d) return alert("Preencha os dados!");
        db.ref('viagens').push({ hora: h, destino: d, passageiros: {}, caruaru: 0 });
    }

    function salvarCaruaru() {
        const val = parseInt(document.getElementById('input-caruaru').value) || 0;
        db.ref(`viagens/${atualViagemKey}`).update({ caruaru: val });
    }

    function limparLista() {
        if (!atualViagemKey) return;
        if (confirm("Deseja apagar TODOS os passageiros desta lista?")) {
            db.ref(`viagens/${atualViagemKey}/passageiros`).remove()
                .then(() => alert("Lista removida!"))
                .catch((e) => alert("Erro: " + e.message));
        }
    }

    function excluirViagem(key, event) {
        event.stopPropagation();
        if(confirm("Deseja excluir este horário?")) db.ref('viagens/' + key).remove();
    }

    function renderMenu(data) {
        const c = document.getElementById('lista-viagens-container');
        c.innerHTML = "";
        for (let key in data) {
            const v = data[key];
            const pCount = v.passageiros ? Object.keys(v.passageiros).length : 0;
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => abrirViagem(key, v);
            div.innerHTML = `<button class="btn-delete-viagem" onclick="excluirViagem('${key}', event)">🗑️</button>
                <strong>${v.hora} - ${v.destino}</strong><br><small>${pCount} pax Recife</small>`;
            c.appendChild(div);
        }
    }

    function abrirViagem(key, v) {
        atualViagemKey = key;
        document.getElementById('view-menu').style.display = 'none';
        document.getElementById('view-lista').style.display = 'block';
        document.getElementById('titulo-viagem').innerText = v.hora + " - " + v.destino;
        document.getElementById('div-caruaru').style.display = (v.hora === "19:05") ? "block" : "none";
        renderPassageiros(v);
    }

    function irParaMenu() {
        if(html5QrCode) html5QrCode.stop();
        atualViagemKey = null;
        document.getElementById('view-menu').style.display = 'block';
        document.getElementById('view-lista').style.display = 'none';
    }

    function renderPassageiros(v) {
        const l = document.getElementById('passageiros-lista');
        const txtOk = document.getElementById('txt-count-ok');
        const txtPending = document.getElementById('txt-count-pending');
        l.innerHTML = "";
        
        if(!v.passageiros || Object.keys(v.passageiros).length === 0) {
            txtOk.innerText = "0";
            txtPending.innerText = "0";
            document.getElementById('acoes-lista').style.display = "none";
            return;
        }

        const paxArray = Object.values(v.passageiros).sort((a,b) => parseInt(a.polt) - parseInt(b.polt));
        const okCount = paxArray.filter(p => p.ok).length;
        txtOk.innerText = okCount;
        txtPending.innerText = paxArray.length - okCount;
        document.getElementById('acoes-lista').style.display = "block";

        paxArray.forEach(p => {
            const div = document.createElement('div');
            div.className = `p-row ${p.ok ? 'ok' : ''} ${p.caxanga ? 'caxanga' : ''}`;
            div.onclick = () => db.ref(`viagens/${atualViagemKey}/passageiros/${p.bilhete}`).update({ok: !p.ok});
            div.innerHTML = `<input type="checkbox" ${p.ok ? 'checked' : ''} style="width:22px; height:22px;">
                <div style="margin-left:12px; flex-grow:1;"><strong>${p.polt} - ${p.nome} ${p.caxanga ? '🔶 (CAXANGÁ)' : ''}</strong><br><small>BILHETE: ${p.bilhete}</small></div>`;
            l.appendChild(div);
        });
    }

    // --- LÓGICA DE PDF COM AGRUPAMENTO DE LINHAS ---
    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file || !atualViagemKey) return;
        document.getElementById('loader').style.display = 'block';
        const reader = new FileReader();
        reader.onload = async function() {
            try {
                const pdfjsLib = window['pdfjs-dist/build/pdf'];
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const text = await page.getTextContent();
                    
                    let items = text.items.map(it => ({
                        str: it.str,
                        x: it.transform[4],
                        y: Math.round(it.transform[5])
                    }));
                    
                    let rows = [];
                    items.forEach(item => {
                        let row = rows.find(r => Math.abs(r.y - item.y) < 5);
                        if (row) row.items.push(item);
                        else rows.push({ y: item.y, items: [item] });
                    });
                    rows.sort((a, b) => b.y - a.y);
                    
                    for (let rIdx = 0; rIdx < rows.length; rIdx++) {
                        let currentLine = rows[rIdx].items.sort((a,b) => a.x - b.x).map(it => it.str).join(" ").toUpperCase();
                        if (/^\d{1,2}\s/.test(currentLine.trim())) {
                            let nextLine = rows[rIdx + 1] ? rows[rIdx + 1].items.map(it => it.str).join(" ").toUpperCase() : "";
                            let fullText = currentLine + " " + nextLine;
                            if (fullText.includes("RECIFE") || fullText.includes("CAXANGA")) {
                                let polt = currentLine.trim().match(/^(\d{1,2})/)[1];
                                let bilheteMatch = fullText.match(/\b\d{6}\b/g);
                                let bilhete = bilheteMatch ? bilheteMatch[bilheteMatch.length - 1] : "N/A";
                                let isCaxanga = fullText.includes("CAXANGA");
                                let nome = currentLine.replace(/^\d{1,2}/, '').split("RECIFE")[0].split("CAXANGA")[0].replace(/\d{7,}/g, '').replace(/\(.*\)/g, '').trim();

                                if (bilhete !== "N/A") {
                                    await db.ref(`viagens/${atualViagemKey}/passageiros/${bilhete}`).update({
                                        polt: polt, nome: nome, bilhete: bilhete, caxanga: isCaxanga
                                    });
                                    await db.ref(`viagens/${atualViagemKey}/passageiros/${bilhete}/ok`).transaction(v => v === null ? false : v);
                                }
                            }
                        }
                    }
                }
                alert("Processamento concluído!");
            } catch (err) { alert("Erro: " + err.message); }
            finally { 
                document.getElementById('loader').style.display = 'none';
                e.target.value = ""; 
            }
        };
        reader.readAsArrayBuffer(file);
    });

        const r = document.getElementById('reader');
        if(
